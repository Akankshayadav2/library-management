# ===============================
# Application
# ===============================
spring.application.name=library-management
server.port=8080

# ===============================
# MySQL connection
# ===============================
# createDatabaseIfNotExist=true -> MySQL creates "library_db" automatically on first run
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# ${DB_USERNAME:root} means: use env variable DB_USERNAME, or "root" if it is not set
spring.datasource.username=${DB_USERNAME:root}
# The password is NEVER written here. It is read from the DB_PASSWORD environment variable.
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
# update -> Hibernate creates/updates tables from our @Entity classes (good for development)
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs (great for learning and debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Don't keep the DB session open while JSON is being written (best practice)
spring.jpa.open-in-view=false

# ===============================
# Error responses
# ===============================
# Include our exception message in Spring's default error JSON
# (Phase 2 replaces this with our own GlobalExceptionHandler)
server.error.include-message=always
